# Nginx для RUSH HOUR: раздаёт статику (dist/) и проксирует API и WebSocket на Node-сервер.
# Положить в /etc/nginx/sites-available/rushhour и включить симлинком в sites-enabled.
# node-сервер при этом запущен на 127.0.0.1:3001 (см. DEPLOY.md).

server {
    listen 80;
    server_name _;                # впиши свой домен или IP

    # Статика игры (результат `npm run build`)
    root /var/www/rushhour/dist;
    index index.html;

    # API таблицы рекордов -> node
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket гонки -> node
    location /race-ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;   # гонка может идти долго
        proxy_send_timeout 3600s;
    }

    # SPA-фолбэк
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэш для ассетов vite (в именах файлов есть хеш)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
